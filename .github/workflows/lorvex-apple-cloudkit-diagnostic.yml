name: Lorvex Apple CloudKit Capability Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Inspect only Apple main bundle capabilities and provisioning
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q 'PyJWT[crypto]==2.10.1'
          python3 - <<'PY'
          import base64,json,os,time,jwt,subprocess,plistlib,urllib.request,urllib.parse,urllib.error
          key=base64.b64decode(os.environ['ASC_KEY_P8']).decode()
          def request(path):
              now=int(time.time())
              token=jwt.encode({'iss':os.environ['ASC_ISSUER_ID'],'iat':now-10,'exp':now+600,'aud':'appstoreconnect-v1'},key,algorithm='ES256',headers={'kid':os.environ['ASC_KEY_ID'],'typ':'JWT'})
              req=urllib.request.Request('https://api.appstoreconnect.apple.com/v1/'+path,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp:return json.load(resp)
              except urllib.error.HTTPError as ex:
                  print('APPLE_HTTP_ERROR',path.split('?')[0],ex.code)
                  try:
                      errors=json.loads(ex.read(2500)).get('errors',[])
                      print('APPLE_ERROR_DETAILS',[(e.get('code'),e.get('title'),str(e.get('detail',''))[:160]) for e in errors])
                  except Exception: pass
                  raise
          response=request('bundleIds?'+urllib.parse.urlencode({'filter[identifier]':'com.itorah.lorvex','limit':10}))
          matching=[b for b in response['data'] if b['attributes'].get('identifier')=='com.itorah.lorvex']
          if len(matching)!=1:raise RuntimeError('main bundle id not uniquely found')
          bundle=matching[0]
          print('MAIN_BUNDLE_ID_FOUND',bundle['id'],bundle['attributes'].get('identifier'))
          caps=request('bundleIds/'+bundle['id']+'/bundleIdCapabilities')
          for cap in caps.get('data',[]):
              attrs=cap.get('attributes',{})
              if attrs.get('capabilityType') in ('ICLOUD','APP_GROUPS','PUSH_NOTIFICATIONS'):
                  print('BUNDLE_CAPABILITY',attrs.get('capabilityType'),'id',cap.get('id'),'settings',json.dumps(attrs.get('settings',[]),sort_keys=True))
          attrs=request('profiles/DQ3BMPXDPQ')['data']['attributes']
          print('MAIN_PROFILE',attrs.get('name'),attrs.get('profileState'),attrs.get('profileType'))
          raw=base64.b64decode(attrs['profileContent'])
          parsed=subprocess.run(['openssl','cms','-verify','-inform','DER','-noverify'],input=raw,capture_output=True)
          if parsed.returncode:raise RuntimeError('CMS decoding failed: '+parsed.stderr[:100].decode(errors='replace'))
          ent=plistlib.loads(parsed.stdout).get('Entitlements',{})
          print('PROFILE_HAS_CLOUDKIT_CONTAINER','iCloud.com.itorah.lorvex' in ent.get('com.apple.developer.icloud-container-identifiers',[]))
          print('PROFILE_ICLOUD_SERVICES',ent.get('com.apple.developer.icloud-services',None))
          print('PROFILE_APNS',ent.get('aps-environment',None))
          print('PROFILE_HAS_GROUP','group.com.itorah.lorvex' in ent.get('com.apple.security.application-groups',[]))
          PY
