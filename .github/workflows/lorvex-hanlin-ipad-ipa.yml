name: Lorvex Hanlin - iPad Agent and IPA

on:
  workflow_dispatch:
    inputs:
      unit_scope:
        description: 'Agent-only may reuse recorded presentation-state evidence when its inputs are unchanged'
        required: true
        type: choice
        default: all
        options:
          - all
          - agent
  push:
    branches:
      - feat/hanlin-ipad-ipa-20261122
    paths:
      - 'apps/apple/Sources/**'
      - 'apps/apple/Vendor/**'
      - 'apps/apple/Package.swift'
      - 'apps/apple/Config/XcodeGen/**'
      - 'apps/apple/script/build_hanlin_ipad_ipa.sh'
      - 'apps/apple/script/install_hanlin_sdk.py'
      - 'apps/apple/script/verify_hanlin_host_ui.sh'
      - 'apps/apple/Tests/LorvexHanlinAgentTests/**'
      - 'apps/apple/Tests/LorvexMobileUITests/HanlinSDKIntegrationTests.swift'
      - 'HanlinSDK.lock.json'

permissions:
  contents: read

concurrency:
  group: lorvex-hanlin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-ipad:
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Xcode 27 and prepare XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! xcodebuild -version | grep -q '^Xcode 27'; then
            selected="$(find /Applications -maxdepth 1 -type d -name 'Xcode*27*.app' -print | sort -V | tail -1)"
            [[ -n "$selected" ]]
            sudo xcode-select -s "$selected/Contents/Developer"
          fi
          xcodebuild -version | grep '^Xcode 27'
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Install the immutable canonical SDK product selection
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/apple/script/install_hanlin_sdk.py
          python3 apps/apple/script/install_hanlin_sdk.py --check > lorvex-hanlin-sdk-installation.json
      - name: Validate Hanlin tool catalog, consent and persistence
        id: test
        shell: bash
        env:
          HANLIN_UNIT_SCOPE: ${{ inputs.unit_scope || 'all' }}
        run: |
          set -euo pipefail
          case "$HANLIN_UNIT_SCOPE" in
            all) test_arguments=(--filter 'LorvexHanlin(Agent|PresentationState)Tests') ;;
            agent) test_arguments=(--filter 'LorvexHanlinAgentTests' --skip 'LorvexHanlinPresentationStateTests') ;;
            *) echo "Unknown Hanlin unit scope: $HANLIN_UNIT_SCOPE" >&2; exit 2 ;;
          esac
          swift test --package-path apps/apple "${test_arguments[@]}" -j 3 2>&1 | tee lorvex-hanlin-agent-tests.log
      - name: Preserve unit-test log immediately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lorvex-Hanlin-unit-test-evidence-${{ github.run_id }}
          path: lorvex-hanlin-agent-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Build iPad app and export unsigned IPA
        if: success() || failure()
        id: build
        shell: bash
        run: |
          set -o pipefail
          bash apps/apple/script/build_hanlin_ipad_ipa.sh 2>&1 | tee lorvex-hanlin-ipad-pipeline.log
      - name: Validate original SDK UI in the real Lorvex iPad app
        if: steps.build.outcome == 'success'
        id: ui
        shell: bash
        run: bash apps/apple/script/verify_hanlin_host_ui.sh
      - name: Package sideload IPA without nested app extensions
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="apps/apple/dist/hanlin-ipad-ipa"
          ipa="$(find "$d" -maxdepth 1 -type f -name '*-UNSIGNED.ipa' | head -1)"
          [[ -f "$ipa" ]]
          output="${ipa%-UNSIGNED.ipa}-SIDELOAD-NO-EXTENSIONS-UNSIGNED.ipa"
          python3 apps/apple/script/package_sideload_compat_ipa.py             --source "$ipa" --output "$output"             --manifest "$d/Lorvex-iPad-sideload-compat-manifest.json"

      - name: Upload real iPad IPA and verifiable manifest
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Lorvex-Hanlin-iPad-IPA-UNSIGNED-${{ github.run_id }}
          path: |
            apps/apple/dist/hanlin-ipad-ipa/*.ipa
            apps/apple/dist/hanlin-ipad-ipa/Lorvex-Hanlin-iPad-manifest.json
            apps/apple/dist/hanlin-ipad-ipa/Lorvex-iPad-sideload-compat-manifest.json
            apps/apple/dist/hanlin-ipad-ipa/ipa-zip-validation.txt
          if-no-files-found: error
          retention-days: 30
      - name: Preserve diagnostics independently of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lorvex-Hanlin-iPad-evidence-${{ github.run_id }}
          path: |
            HanlinSDK.lock.json
            lorvex-hanlin-sdk-installation.json
            lorvex-hanlin-agent-tests.log
            lorvex-hanlin-ipad-pipeline.log
            apps/apple/dist/hanlin-host-ui
            apps/apple/dist/hanlin-ipad-ipa/lorvex-hanlin-build.log
          if-no-files-found: warn
          retention-days: 21
