name: Lorvex Hanlin - iPad Agent and IPA

on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Full validation or the source-bound original UI continuation'
        required: true
        type: choice
        default: full
        options:
          - full
          - ui
      unit_scope:
        description: 'Agent-only may reuse recorded presentation-state evidence when its inputs are unchanged'
        required: true
        type: choice
        default: all
        options:
          - all
          - agent
  push:
    branches:
      - feat/hanlin-ipad-ipa-20261122
    paths:
      - 'apps/apple/Sources/**'
      - 'apps/apple/Vendor/**'
      - 'apps/apple/Package.swift'
      - 'apps/apple/Config/XcodeGen/**'
      - 'apps/apple/script/build_hanlin_ipad_ipa.sh'
      - 'apps/apple/script/install_hanlin_sdk.py'
      - 'apps/apple/script/verify_hanlin_host_ui.sh'
      - 'apps/apple/Tests/LorvexHanlinAgentTests/**'
      - 'apps/apple/Tests/LorvexMobileUITests/HanlinSDKIntegrationTests.swift'
      - 'HanlinSDK.lock.json'

permissions:
  contents: read

concurrency:
  group: lorvex-hanlin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-ipad:
    runs-on: xcode-27
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing native evidence for the UI-only continuation
        if: inputs.validation_scope == 'ui'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('.')
          receipt = json.loads((root / 'apps/apple/docs/development/HANLIN_NATIVE_ACCEPTANCE_20261123.json').read_text())
          assert receipt['schemaVersion'] == 2
          assert receipt['nativeAgentTests']['status'] == 'PASS' and receipt['nativeAgentTests']['passed'] == 6
          assert receipt['deviceBuild']['status'] == 'BUILD SUCCEEDED'
          repair_path = root / 'apps/apple/docs/development/HANLIN_DRAFT_UI_REPAIR_20261123.json'
          inputs, revision = receipt['sourceInputs'], receipt['sdkRevision']
          if repair_path.exists():
              import hashlib
              repair = json.loads(repair_path.read_text())
              assert repair['schemaVersion'] == 1
              assert repair['baselineConsumerRevision'] == receipt['consumerRevision']
              assert repair['baselineSdkRevision'] == receipt['sdkRevision']
              assert repair['historicalDeviceEvidence']['consumerRevision'] == receipt['consumerRevision']
              assert repair['historicalDeviceEvidence']['currentRepairedBinaryClaimed'] is False
              assert repair['sourceInputs'].keys() == receipt['sourceInputs'].keys()
              expected_deltas = {'apps/apple/Sources/LorvexMobileApp/' + name for name in (
                  'LorvexHanlinAssistantView.swift', 'LorvexHanlinChatWorkspace.swift', 'LorvexHanlinComposer.swift')}
              assert set(repair['hostSourceDelta']) == expected_deltas
              entries = {}
              for row in subprocess.check_output(['git', 'ls-tree', '-rz', 'HEAD', '--', 'apps/apple/Sources']).split(b'\0'):
                  if row:
                      metadata, name = row.split(b'\t', 1)
                      mode, kind, blob = metadata.decode().split()
                      entries[name.decode()] = {'mode': mode, 'type': kind, 'object': blob}
              for path, delta in repair['hostSourceDelta'].items():
                  assert entries[path] == delta['after'], 'Unreviewed UI repair: ' + path
                  entries[path] = delta['before']
              digest = hashlib.sha256(json.dumps(entries, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              assert digest == repair['baselineSourceEntriesSHA256'], 'Source changed outside the three reviewed draft adapters'
              for path, expected in repair['unchangedAgentAndConfigurationInputs'].items():
                  actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
                  assert actual == expected, 'Retained native Agent inputs changed: ' + path
              for path in ('apps/apple/Package.swift', 'apps/apple/Package.resolved', 'apps/apple/Tests', 'apps/apple/core', 'apps/apple/Config'):
                  assert repair['sourceInputs'][path] == receipt['sourceInputs'][path]
              inputs, revision = repair['sourceInputs'], repair['sdkRevision']
          assert json.loads((root / 'HanlinSDK.lock.json').read_text())['revision'] == revision
          for path, expected in inputs.items():
              actual = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
              assert actual == expected, 'Native evidence does not match the current source: ' + path
          scripts = receipt['nativeScriptInputs']
          assert scripts['root'] == 'apps/apple/script'
          assert scripts['excludedUISetupPath'] == 'apps/apple/script/verify_hanlin_host_ui.sh'
          current_scripts = {}
          rows = subprocess.check_output(['git', 'ls-tree', '-rz', 'HEAD', '--', scripts['root']])
          for row in rows.split(b'\0'):
              if not row:
                  continue
              metadata, name = row.split(b'\t', 1)
              mode, kind, blob = metadata.decode().split()
              current_scripts[name.decode()] = {'mode': mode, 'type': kind, 'object': blob}
          current_ui = current_scripts.pop(scripts['excludedUISetupPath'])
          assert current_scripts == scripts['entries'], 'Native build or test script inputs changed'
          assert current_ui == receipt['uiSetupContinuation']['currentScript'], 'UI setup delta changed'
          print('Exact source guards passed. Agent evidence remains bound to run 45119218473; its device export remains historical. The reviewed current UI compiles and executes below.')
          PY
      - name: Confirm Xcode 27 and prepare XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          if ! grep -q '^Xcode 27' <<<"$xcode_version"; then
            selected="$(find /Applications -maxdepth 1 -type d -name 'Xcode*27*.app' -print | sort -V | tail -1)"
            [[ -n "$selected" ]]
            sudo xcode-select -s "$selected/Contents/Developer"
          fi
          xcodebuild -version | grep '^Xcode 27'
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Install the immutable canonical SDK product selection
        shell: bash
        run: |
          set -euo pipefail
          python3 apps/apple/script/install_hanlin_sdk.py
          python3 apps/apple/script/install_hanlin_sdk.py --check > lorvex-hanlin-sdk-installation.json
      - name: Verify the complete canonical UI repair source profile
        if: inputs.validation_scope == 'ui'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          repair_path = root / 'apps/apple/docs/development/HANLIN_DRAFT_UI_REPAIR_20261123.json'
          if not repair_path.exists():
              raise SystemExit(0)
          repair = json.loads(repair_path.read_text())
          profile = repair['sdkProfile']
          sdk = root / profile['path']
          installed = json.loads((sdk / '.hanlin-sdk/installation.json').read_text())
          assert installed['state'] == 'installed' and installed['revision'] == repair['sdkRevision']
          assert installed['sourcePaths'] == profile['sourcePaths']
          assert installed['binaryTargets'] == profile['binaryTargets'] == []
          assert hashlib.sha256((sdk / 'Package.swift').read_bytes()).hexdigest() == profile['manifestSHA256'] == profile['baselineManifestSHA256']
          entries = {}
          rows = subprocess.check_output(['git', '-C', str(sdk), 'ls-tree', '-rz', 'HEAD', '--', *profile['sourcePaths']])
          for row in rows.split(b'\0'):
              if row:
                  metadata, name = row.split(b'\t', 1)
                  mode, kind, blob = metadata.decode().split()
                  entries[name.decode()] = {'mode': mode, 'type': kind, 'object': blob}
          assert entries == profile['entries'] and len(entries) == profile['currentEntries']
          draft_path = 'Packages/HanlinPresentationSDK/Sources/HanlinChatUI/Composer/HanlinComposerDraft.swift'
          assert set(profile['added']) == {draft_path} and not profile['modified'] and not profile['removed']
          assert entries.pop(draft_path) == profile['added'][draft_path]
          digest = hashlib.sha256(json.dumps(entries, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          assert digest == profile['unchangedEntriesSHA256'] and len(entries) == profile['baselineEntries']
          print('All 534 original selected source/resource entries and manifest are unchanged; the one added file is the reviewed original live draft owner. No new device binary is claimed.')
          PY
      - name: Validate Hanlin tool catalog, consent and persistence
        if: inputs.validation_scope != 'ui'
        id: test
        shell: bash
        env:
          HANLIN_UNIT_SCOPE: ${{ inputs.unit_scope || 'all' }}
        run: |
          set -euo pipefail
          case "$HANLIN_UNIT_SCOPE" in
            all) test_arguments=(--filter 'LorvexHanlin(Agent|PresentationState)Tests') ;;
            agent) test_arguments=(--filter 'LorvexHanlinAgentTests' --skip 'LorvexHanlinPresentationStateTests') ;;
            *) echo "Unknown Hanlin unit scope: $HANLIN_UNIT_SCOPE" >&2; exit 2 ;;
          esac
          swift test --package-path apps/apple "${test_arguments[@]}" -j 3 2>&1 | tee lorvex-hanlin-agent-tests.log
      - name: Preserve unit-test log immediately
        if: always() && inputs.validation_scope != 'ui'
        uses: actions/upload-artifact@v4
        with:
          name: Lorvex-Hanlin-unit-test-evidence-${{ github.run_id }}
          path: lorvex-hanlin-agent-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Build iPad app and export unsigned IPA
        if: (success() || failure()) && inputs.validation_scope != 'ui'
        id: build
        shell: bash
        run: |
          set -o pipefail
          bash apps/apple/script/build_hanlin_ipad_ipa.sh 2>&1 | tee lorvex-hanlin-ipad-pipeline.log
      - name: Package sideload IPA without nested app extensions
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          d="apps/apple/dist/hanlin-ipad-ipa"
          ipa="$(find "$d" -maxdepth 1 -type f -name '*-UNSIGNED.ipa' | head -1)"
          [[ -f "$ipa" ]]
          output="${ipa%-UNSIGNED.ipa}-SIDELOAD-NO-EXTENSIONS-UNSIGNED.ipa"
          python3 apps/apple/script/package_sideload_compat_ipa.py             --source "$ipa" --output "$output"             --manifest "$d/Lorvex-iPad-sideload-compat-manifest.json"

      - name: Upload real iPad IPA and verifiable manifest
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Lorvex-Hanlin-iPad-IPA-UNSIGNED-${{ github.run_id }}
          path: |
            apps/apple/dist/hanlin-ipad-ipa/*.ipa
            apps/apple/dist/hanlin-ipad-ipa/Lorvex-Hanlin-iPad-manifest.json
            apps/apple/dist/hanlin-ipad-ipa/Lorvex-iPad-sideload-compat-manifest.json
            apps/apple/dist/hanlin-ipad-ipa/ipa-zip-validation.txt
          if-no-files-found: error
          retention-days: 30
      - name: Validate original SDK UI in the real Lorvex iPad app
        if: inputs.validation_scope == 'ui' || steps.build.outcome == 'success'
        id: ui
        shell: bash
        run: bash apps/apple/script/verify_hanlin_host_ui.sh
      - name: Preserve diagnostics independently of outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lorvex-Hanlin-iPad-evidence-${{ github.run_id }}
          path: |
            HanlinSDK.lock.json
            lorvex-hanlin-sdk-installation.json
            lorvex-hanlin-agent-tests.log
            lorvex-hanlin-ipad-pipeline.log
            apps/apple/dist/hanlin-host-ui
            apps/apple/dist/hanlin-ipad-ipa/lorvex-hanlin-build.log
          if-no-files-found: warn
          retention-days: 21
