name: BoardActivationCalibration
options:
  minimumXcodeGenVersion: 2.44.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_IDENTITY: "-"
targets:
  BoardActivationControl:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itorah.lorvex.boardcalibration
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Board Calibration
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleLocalizations: "en he"
    info:
      path: Generated-Control-Info.plist
      properties:
        CFBundleLocalizations: [en, he]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
  BoardCalibrationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BoardActivationControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.itorah.lorvex.boardcalibration.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BoardActivationControl
schemes:
  BoardCalibrationUITests:
    build:
      targets:
        BoardActivationControl: all
        BoardCalibrationUITests: [test]
    test:
      targets: [BoardCalibrationUITests]
      gatherCoverageData: false
